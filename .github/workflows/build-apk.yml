name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # Tự tìm thư mục chứa capacitor.config.json (kể cả khi tải lên GitHub bị lồng thêm 1 thư mục)
      - name: Xác định thư mục dự án
        run: |
          CFG=$(find . -maxdepth 4 -name capacitor.config.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$CFG" ]; then
            echo "::error::Không tìm thấy capacitor.config.json. Hãy tải lên GitHub TOÀN BỘ nội dung đã giải nén (www, assets, resources, package.json, capacitor.config.json...)."
            ls -R . | head -60
            exit 1
          fi
          DIR=$(dirname "$CFG")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Thư mục dự án: $DIR"

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kiểm tra thư mục web (www)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f www/index.html ]; then
            if [ -f index.html ]; then
              mkdir -p www
              cp index.html www/
              for f in manifest.json sw.js; do [ -f "$f" ] && cp "$f" www/ || true; done
              [ -d icons ] && cp -r icons www/ || true
            else
              echo "::error::Không tìm thấy www/index.html"
              exit 1
            fi
          fi
          ls -la www

      - name: Cài thư viện Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund --legacy-peer-deps
          else
            npm init -y
            npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          fi

      - name: Tạo dự án Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          ls android

      - name: Cấp quyền camera (quét QR) và thông báo
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$MANIFEST"
          fi
          grep -n "uses-permission\|uses-feature" "$MANIFEST"

      - name: Đặt biểu tượng VATM cho ứng dụng
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -d resources/android ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              SRC="resources/android/mipmap-$d"
              DST="android/app/src/main/res/mipmap-$d"
              if [ -d "$SRC" ] && [ -d "$DST" ]; then
                cp -f "$SRC"/*.png "$DST"/
              fi
            done
          fi
          echo "Đã đặt biểu tượng VATM"

      - name: Đồng bộ giao diện web vào Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Tải file APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VATM-HoSo-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
