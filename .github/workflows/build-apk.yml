name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chuan bi project Capacitor
        run: |
          set -e
          mkdir -p /tmp/www
          if [ -f www/index.html ]; then
            cp -r www/. /tmp/www/
          elif [ -f public/index.html ]; then
            cp -r public/. /tmp/www/
          elif [ -f index.html ]; then
            rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='*.md' ./ /tmp/www/
          else
            echo "Khong tim thay index.html"; ls -la; exit 1
          fi
          rm -rf www android node_modules package.json package-lock.json capacitor.config.json
          mkdir www && cp -r /tmp/www/. www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "vn.vatm.hosoxuatcanh",
            "appName": "VATM Hồ sơ",
            "webDir": "www",
            "backgroundColor": "#ffffff"
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          ls www

      - name: Them Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
